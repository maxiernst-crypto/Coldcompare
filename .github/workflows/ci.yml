name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cc, POSTGRES_PASSWORD: cc, POSTGRES_DB: cc }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cc:cc@localhost:5432/cc
      TEST_DATABASE_URL: postgres://cc:cc@localhost:5432/cc_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CONTENT_PREVIEW: "true"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-please-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: PGPASSWORD=cc psql -h localhost -U cc -c "CREATE DATABASE cc_test" cc
      - run: npm run typecheck
      - run: npm run db:setup
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
