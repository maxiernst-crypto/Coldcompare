# Local PostgreSQL for development: `docker compose up -d`, then `npm run db:setup`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coldcompare
      POSTGRES_PASSWORD: coldcompare
      POSTGRES_DB: coldcompare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
